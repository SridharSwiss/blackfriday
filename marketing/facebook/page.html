<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:#151314}
.cross{background:#D52B1E;position:relative;border-radius:22%}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;border-radius:2%}
.cross:before{left:20%;right:20%;top:39%;bottom:39%}.cross:after{top:20%;bottom:20%;left:39%;right:39%}
#profile{width:1080px;height:1080px;background:#D52B1E;display:grid;place-items:center;overflow:hidden;position:relative}
#profile .ring{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#E8463A 0,#D52B1E 55%,#B52217 100%)}
#profile .box{position:relative;text-align:center;color:#fff;margin-top:-20px}
#profile .big{width:380px;height:380px;margin:0 auto 34px;background:#fff;border-radius:84px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.28)}
#profile .big:before,#profile .big:after{content:"";position:absolute;background:#D52B1E;border-radius:10px}
#profile .big:before{left:76px;right:76px;top:148px;bottom:148px}#profile .big:after{top:76px;bottom:76px;left:148px;right:148px}
#profile b{display:block;font-size:112px;letter-spacing:2px;font-weight:900;line-height:1}
#profile b i{font-style:normal;color:#FFD200}
#profile span{display:block;margin-top:14px;font-size:38px;letter-spacing:9px;font-weight:700;opacity:.92}
#cover{width:1640px;height:624px;position:relative;overflow:hidden;background:#151314;color:#fff}
#cover .band{position:absolute;left:-200px;top:-150px;width:1250px;height:900px;background:#D52B1E;transform:rotate(-14deg);transform-origin:center}
#cover .band2{position:absolute;right:-230px;bottom:-400px;width:760px;height:640px;background:#FFD200;transform:rotate(-14deg)}
#cover .in{position:absolute;left:270px;top:0;bottom:0;width:1100px;display:flex;flex-direction:column;justify-content:center}
#cover .brand{display:flex;align-items:center;gap:18px;margin-bottom:26px}
#cover .brand .cross{width:74px;height:74px;background:#fff}#cover .brand .cross:before,#cover .brand .cross:after{background:#D52B1E}
#cover .brand span{font-size:44px;font-weight:900;letter-spacing:2px}#cover .brand span i{font-style:normal;color:#FFD200}
#cover h1{font-size:90px;line-height:1.0;font-weight:900;letter-spacing:-1.5px}
#cover h1 em{font-style:normal;color:#FFD200}
#cover p{margin-top:22px;font-size:34px;font-weight:600;opacity:.95}
#cover .date{position:absolute;right:230px;bottom:62px;background:#151314;color:#FFD200;padding:14px 26px;border-radius:12px;font-size:38px;font-weight:900;letter-spacing:2px;transform:rotate(-4deg)}
#cover .url{margin-top:26px;display:inline-block;align-self:flex-start;background:#fff;color:#D52B1E;padding:10px 24px;border-radius:999px;font-size:36px;font-weight:900;letter-spacing:1px}</style>

<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F6F5F3;font-family:"Public Sans",sans-serif;color:#151314}
.sc{position:absolute;inset:0;opacity:0}
.brand{position:absolute;left:72px;top:90px;display:flex;align-items:center;gap:20px;font:900 50px/1 Archivo;z-index:5}
.cross{width:66px;height:66px;background:#D52B1E;border-radius:12px;position:relative}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.cross:before{width:40px;height:13px}.cross:after{width:13px;height:40px}
.date{position:absolute;right:72px;top:96px;background:#151314;color:#FFD200;font:700 30px/1 "JetBrains Mono";padding:18px 22px;border-radius:12px;z-index:5}
.big{position:absolute;left:72px;right:72px;top:400px;font:900 160px/.86 Archivo;font-stretch:78%;text-transform:uppercase;letter-spacing:-.02em}
.big .r{color:#D52B1E;display:block}
.sub{position:absolute;left:72px;right:72px;top:1000px;font:700 52px/1.2 "Public Sans"}
.eleven{position:absolute;right:40px;top:1240px;font:900 520px/1 Archivo;color:#FFD200;letter-spacing:-.04em;transform:rotate(-8deg)}
.rank{position:absolute;left:72px;top:300px;font:900 300px/1 Archivo;color:#D52B1E}
.shop{position:absolute;left:72px;top:640px;font:700 34px/1 "JetBrains Mono";letter-spacing:.08em;text-transform:uppercase;color:#5E5A5B}
.name{position:absolute;left:72px;right:72px;top:700px;font:900 104px/.95 Archivo;letter-spacing:-.01em}
.spec{position:absolute;left:72px;right:72px;top:1000px;font:600 38px/1.3 "Public Sans";color:#5E5A5B}
.now{position:absolute;left:72px;top:1120px;font:900 150px/1 Archivo;background:#FFD200;padding:14px 30px 8px;border-radius:22px;letter-spacing:-.02em}
.was{position:absolute;left:84px;top:1340px;font:700 54px/1 "Public Sans";color:#5E5A5B}
.was:after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:6px;background:#D52B1E;transform:scaleX(var(--k,1));transform-origin:left}
.off{position:absolute;right:72px;top:300px;width:300px;height:300px;border-radius:50%;background:#D52B1E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 100px/1 Archivo;font-stretch:82%;transform:rotate(-10deg)}
.off small{font-size:30px;letter-spacing:.1em;margin-top:6px}
.extra{position:absolute;left:72px;right:72px;top:1480px;font:700 40px/1.3 "Public Sans";color:#1E7A46}
.extra b{font-family:"JetBrains Mono";background:#151314;color:#FFD200;padding:4px 14px;border-radius:8px}
.bar{position:absolute;left:0;bottom:0;height:16px;background:#D52B1E;z-index:6}
.cta{position:absolute;left:72px;right:72px;top:1180px;height:170px;border-radius:32px;background:#D52B1E;color:#fff;display:flex;align-items:center;justify-content:center;font:900 76px/1 Archivo}
.legal{position:absolute;left:72px;right:72px;bottom:110px;font:600 26px/1.45 "Public Sans";color:#5E5A5B}
.legal b{background:#151314;color:#fff;padding:3px 10px;border-radius:6px;margin-right:10px;font-size:22px;letter-spacing:.08em}
</style></head><body>
<div class="brand"><span class="cross"></span>AKTIONS.CH</div>
<div class="date">SINGLES DAY · 11.11.</div>
<div id="scenes"></div>
<div class="bar" id="bar"></div>
<script>
const DEALS=[
 {shop:"Samsung Schweiz",name:"Samsung 65\" OLED S90H",spec:"4K OLED · Modell 2026",now:"CHF 1'455",was:"CHF 2'599",off:"−44%",extra:"Du sparst <b>CHF 1'143</b>"},
 {shop:"Samsung Schweiz",name:"Samsung 65\" Mini LED M1EH",spec:"4K Mini LED · Modell 2026",now:"CHF 476",was:"CHF 1'399",off:"−66%",extra:"Du sparst <b>CHF 923</b>"},
 {shop:"Samsung Schweiz",name:"Odyssey G7 40\" Gaming-Monitor",spec:"G75F · 40 Zoll",now:"CHF 504",was:"CHF 1'119",off:"−55%",extra:"Du sparst <b>CHF 615</b>"},
 {shop:"Samsung Schweiz",name:"Galaxy S26 Ultra 512 GB",spec:"12 GB RAM · Silver Shadow",now:"CHF 991",was:"CHF 1'479",off:"−33%",extra:"Mit Code <b>SINGLESWEEK</b> nochmals −11 %"},
 {shop:"Pfister",name:"Hom'In Ecksofa Amelia",spec:"Dazu: 15 % auf alles für Member bis 12.11.",now:"CHF 999",was:"CHF 1'998",off:"−50%",extra:"Du sparst <b>CHF 999</b>"}
];
const T0=2.2, D=2.6, END=T0+DEALS.length*D, DUR=END+2.8;
const sc=document.getElementById('scenes');
sc.innerHTML=`<section class="sc" id="intro"><div class="big"><span>Die 5 besten</span><span class="r">Singles-Day-Deals</span></div><div class="sub">Geprüft am 10.11.2026 · nur heute & morgen</div><div class="eleven">11.11</div></section>`
 + DEALS.map((d,i)=>`<section class="sc deal"><div class="rank">#${DEALS.length-i}</div><div class="shop">${d.shop}</div><div class="name">${d.name}</div><div class="spec">${d.spec}</div><div class="now">${d.now}</div><div class="was">${d.was}</div><div class="off">${d.off}<small>RABATT</small></div><div class="extra">${d.extra}</div></section>`).join("")
 + `<section class="sc" id="outro"><div class="big" style="top:330px"><span>Alle Live-Deals</span><span class="r">auf Aktions.ch</span></div><div class="cta">Link in Bio →</div><div class="legal"><b>ANZEIGE</b>Affiliate-Links. Preise Stand 10.11.2026, gültig bis 11.11.2026 bzw. Pfister-Sofa solange Vorrat. Preise können sich ändern.</div></section>`;
const S=[...document.querySelectorAll('.sc')];
const cl=x=>Math.max(0,Math.min(1,x)), ease=t=>1-Math.pow(1-cl(t),3), back=t=>{t=cl(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function win(i){ if(i===0) return [0,T0]; if(i===S.length-1) return [END,DUR]; return [T0+(i-1)*D, T0+i*D]; }
window.DUR=DUR;
window.render=function(t){
 S.forEach((s,i)=>{const [a,b]=win(i); const p=(t-a)/(b-a); const vis=t>=a&&t<b+0.0001||(i===S.length-1&&t>=a);
  s.style.opacity=vis?Math.min(1,(t-a)/0.25):0;
  if(!vis) return;
  const lt=t-a, out=i<S.length-1? cl((t-(b-0.25))/0.25):0;
  s.style.transform=`translateX(${-out*1080}px)`;
  s.querySelectorAll('.rank,.shop,.name,.spec,.big,.sub').forEach((e,k)=>{const k2=ease((lt-k*0.08)/0.4);e.style.opacity=k2;e.style.transform=`translateY(${(1-k2)*70}px)`;});
  s.querySelectorAll('.was').forEach(e=>{e.style.opacity=cl((lt-0.4)/0.2);e.style.setProperty('--k',ease((lt-0.6)/0.3));});
  s.querySelectorAll('.now').forEach(e=>{const k=back((lt-0.8)/0.4);e.style.opacity=cl((lt-0.8)/0.15);e.style.transform=`scale(${0.5+0.5*k})`;e.style.transformOrigin='left center';});
  s.querySelectorAll('.off').forEach(e=>{const k=back((lt-1.0)/0.4);e.style.opacity=cl((lt-1.0)/0.15);e.style.transform=`rotate(-10deg) scale(${0.3+0.7*k})`;});
  s.querySelectorAll('.extra').forEach(e=>{const k=ease((lt-1.3)/0.4);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*40}px)`;});
  s.querySelectorAll('.eleven').forEach(e=>{const k=back((lt-0.6)/0.6);e.style.opacity=cl((lt-0.6)/0.2);e.style.transform=`rotate(-8deg) scale(${0.4+0.6*k})`;});
  s.querySelectorAll('.cta').forEach(e=>{const k=back((lt-0.5)/0.4);e.style.opacity=cl((lt-0.5)/0.2);e.style.transform=`scale(${(0.5+0.5*k)*(1+0.03*Math.sin(Math.max(0,lt-1)*6))})`;});
  s.querySelectorAll('.legal').forEach(e=>{e.style.opacity=cl((lt-0.9)/0.3);});
 });
 document.getElementById('bar').style.width=(cl(t/DUR)*1080)+'px';
};
render(0);
</script></body></html>

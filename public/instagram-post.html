<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Post — Black Friday Schweiz 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Public Sans", "Archivo", system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #ffffff;
  }
  /* Square feed post 1080x1080 (1:1) */
  .post {
    position: relative;
    width: 100vw;
    height: 100vw;
    max-width: 1080px;
    max-height: 1080px;
    margin: 0 auto;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%);
    border: 8px solid #1e293b;
    overflow: hidden;
  }
  .red-band {
    position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #D52B1E 0%, #0ea5e9 60%, #8b5cf6 100%);
  }
  .glow {
    position: absolute; top: 15%; right: -10%;
    width: 55%; height: 55%;
    background: radial-gradient(circle, rgba(213,43,30,0.3) 0%, transparent 70%);
    filter: blur(55px);
  }
  .inner {
    position: relative;
    padding: 48px 40px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    z-index: 5;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(213,43,30,0.18);
    border: 1px solid rgba(213,43,30,0.5);
    color: #fca5a5;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 20px;
    box-shadow: 0 0 20px rgba(213,43,30,0.25);
  }
  .chip .dot {
    width: 7px; height: 7px; background: #D52B1E; border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(213,43,30,0.3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }
  h1 {
    font-family: "Archivo", system-ui, sans-serif;
    font-size: clamp(1.9rem, 7vw, 2.7rem);
    font-weight: 850;
    line-height: 1.08;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
  }
  h1 .accent { color: #f87171; }
  .save {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #e2e8f0;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 10px;
    margin-bottom: 26px;
    backdrop-filter: blur(6px);
  }
  .save svg { width: 16px; height: 16px; stroke-width: 2; }
  .meta {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-bottom: 30px;
    font-size: 0.8rem;
    color: #94a3b8;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .meta b { color: #ffffff; }
  .divider {
    width: 56px; height: 1px; background: #334155;
    margin: 30px auto 24px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #D52B1E;
    color: #ffffff;
    text-decoration: none;
    font-weight: 900;
    font-size: 1.1rem;
    padding: 16px 34px;
    border-radius: 12px;
    box-shadow: 0 18px 36px -8px rgba(213,43,30,0.45);
    border: none;
    cursor: pointer;
    transition: transform .15s, background .15s;
    max-width: 82%;
    margin: 0 auto;
  }
  .cta:hover { background: #a61f16; transform: translateY(-2px); }
  .cta svg { width: 18px; height: 18px; stroke-width: 2.5; }
  .brand {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 0.75rem; color: #64748b; font-weight: 800; letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .link-note {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; color: #475569; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<section class="post">
  <div class="red-band"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="chip"><span class="dot"></span>Black Friday Schweiz 2026</div>
    <h1>Top <span class="accent">Deals in CHF</span></h1>
    <div class="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="7 7 7 12 12 12"/></svg> Speichern für Black Week</div>
    <div class="meta">
      <div><b>100+</b> Top-Deals</div>
      <div><b>CHF</b> Preise Schweiz</div>
      <div><b>27.11.</b> Black Friday</div>
    </div>
    <div class="divider"></div>
    <button class="cta" onclick="location.href='https://aktions.ch/?utm_source=instagram&utm_medium=post&utm_campaign=blackfriday2026'">Jetzt ansehen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
  <div class="brand">Aktions.ch</div>
  <div class="link-note">Link in Bio</div>
</section>
</body>
</html>

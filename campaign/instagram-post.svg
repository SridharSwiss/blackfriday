<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D52B1E"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#D52B1E" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#D52B1E" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="972" cy="162" r="594" fill="url(#glow)" filter="url(#blur)"/>
  <rect width="1080" height="54" fill="url(#band)"/>

  <!-- Chip -->
  <rect x="270" y="132" width="280" height="46" rx="23" fill="#D52B1E" opacity="0.18" stroke="#D52B1E" stroke-width="1.5" opacity="0.5"/>
  <circle cx="318" cy="155" r="6" fill="#D52B1E"/>
  <text x="338" y="161" font-family="Archivo, sans-serif" font-size="24" font-weight="900" fill="#fca5a5" letter-spacing="1.8">BLACK FRIDAY SCHWEIZ 2026</text>

  <!-- Headline -->
  <text x="540" y="330" font-family="Archivo, sans-serif" font-size="64" font-weight="850" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Top</text>
  <text x="540" y="406" font-family="Archivo, sans-serif" font-size="64" font-weight="850" fill="#f87171" text-anchor="middle" letter-spacing="-1">Deals in CHF</text>

  <!-- Save reminder -->
  <rect x="336" y="480" width="408" height="52" rx="10" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-width="1" opacity="0.18"/>
  <path d="M372 510 l-6 6 l-6-6" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 510 h24" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <text x="414" y="514" font-family="Public Sans, sans-serif" font-size="25" font-weight="700" fill="#e2e8f0">Speichern für Black Week</text>

  <!-- Meta -->
  <g font-family="Public Sans, sans-serif" font-size="24" font-weight="700" letter-spacing="1.6" text-anchor="middle">
    <text x="270" y="590" fill="#ffffff" font-weight="900">100+</text>
    <text x="270" y="620" fill="#94a3b8">TOP-DEALS</text>
    <text x="540" y="590" fill="#ffffff" font-weight="900">CHF</text>
    <text x="540" y="620" fill="#94a3b8">PREISE SCHWEIZ</text>
    <text x="810" y="590" fill="#ffffff" font-weight="900">27.11.</text>
    <text x="810" y="620" fill="#94a3b8">BLACK FRIDAY</text>
  </g>

  <!-- CTA Button -->
  <rect x="108" y="690" width="864" height="86" rx="20" fill="#D52B1E"/>
  <text x="540" y="742" font-family="Public Sans, sans-serif" font-size="33" font-weight="900" fill="#ffffff" text-anchor="middle">Jetzt ansehen</text>
  <path d="M700 734 l24 24 l-24 24" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M748 734 h42" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Brand -->
  <text x="540" y="1020" font-family="Archivo, sans-serif" font-size="22" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="3.5">AKTIONS.CH</text>
  <text x="540" y="1050" font-family="Public Sans, sans-serif" font-size="20" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.4">Link in Bio</text>
</svg>

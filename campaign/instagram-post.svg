<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="redgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D52B1E"/>
      <stop offset="100%" stop-color="#a61f16"/>
    </linearGradient>
  </defs>

  <!-- Off-white background -->
  <rect width="1080" height="1080" fill="#f3f4f6"/>

  <!-- Top header -->
  <circle cx="118" cy="132" r="44" fill="#D52B1E"/>
  <path d="M94 108 l-28 48 h28 l-28 48" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="204" y="136" font-family="Archivo, sans-serif" font-size="52" font-weight="900" fill="#0f172a">AKTIONS.CH</text>
  <rect x="556" y="96" width="500" height="72" rx="36" fill="#0f172a"/>
  <text x="806" y="134" font-family="Archivo, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">BLACK FRIDAY</text>
  <text x="806" y="134" font-family="Archivo, sans-serif" font-size="36" font-weight="800" fill="#f59e0b" text-anchor="middle" dx="150">IN 17 TAGEN</text>

  <!-- DEAL DES TAGES -->
  <text x="60" y="330" font-family="Archivo, sans-serif" font-size="118" font-weight="900" fill="#0f172a" letter-spacing="-2">DEAL</text>
  <text x="60" y="480" font-family="Archivo, sans-serif" font-size="118" font-weight="900" fill="#D52B1E" letter-spacing="-2">DES TAGES</text>

  <!-- Product card -->
  <rect x="60" y="560" width="960" height="340" rx="40" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>

  <!-- Product icon (yellow rounded square) -->
  <rect x="140" y="620" width="260" height="260" rx="60" fill="#f59e0b"/>
  <g transform="translate(235, 730)">
    <circle cx="130" cy="130" r="52" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <rect x="112" cy="95" width="36" height="14" rx="7" fill="#0f172a"/>
    <line x1="130" y1="130" x2="130" y2="78" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="130" y1="130" x2="198" y2="130" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Product name -->
  <text x="430" y="698" font-family="Archivo, sans-serif" font-size="60" font-weight="900" fill="#0f172a">Top Deal</text>
  <text x="430" y="776" font-family="Archivo, sans-serif" font-size="32" font-weight="600" fill="#475569">Schweiz · CHF · Black Friday 2026</text>

  <!-- Discount circle -->
  <circle cx="830" y="710" r="110" fill="#D52B1E"/>
  <text cx="830" cy="710" font-family="Archivo, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" dy="0.35em">−41%</text>
  <text cx="830" cy="782" font-family="Archivo, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">RABATT</text>

  <!-- Pricing -->
  <text x="140" y="880" font-family="Archivo, sans-serif" font-size="48" font-weight="700" fill="#64748b">CHF 279.–</text>
  <line x1="140" y1="872" x2="320" y2="872" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <rect x="380" y="820" width="560" height="110" rx="30" fill="#f59e0b"/>
  <text x="660" y="902" font-family="Archivo, sans-serif" font-size="88" font-weight="900" fill="#0f172a" text-anchor="middle">CHF 165</text>

  <!-- Green checkmark line -->
  <text x="140" y="970" font-family="Archivo, sans-serif" font-size="32" font-weight="700" fill="#15803d">✓ Tiefster Preis seit 90 Tagen</text>

  <!-- CTA button -->
  <rect x="60" y="900" width="960" height="100" rx="50" fill="url(#redgrad)"/>
  <text x="540" y="974" font-family="Archivo, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle">Link in Bio →</text>

  <!-- Fine print disclaimer -->
  <rect x="60" y="1000" width="960" height="80" fill="#f3f4f6"/>
  <text x="60" y="1042" font-family="Archivo, sans-serif" font-size="24" font-weight="900" fill="#0f172a">ANZEIGE</text>
  <text x="220" y="1042" font-family="Public Sans, sans-serif" font-size="24" fill="#475569">Affiliate-Link · Amazon.de EUR · CH MWST an der Kasse</text>
</svg>

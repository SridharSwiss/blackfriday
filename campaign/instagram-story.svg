<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="redgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D52B1E"/>
      <stop offset="100%" stop-color="#a61f16"/>
    </linearGradient>
  </defs>

  <!-- Off-white background -->
  <rect width="1080" height="1920" fill="#f3f4f6"/>

  <!-- Top header -->
  <circle cx="118" cy="132" r="44" fill="#D52B1E"/>
  <path d="M94 108 l-28 48 h28 l-28 48" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="204" y="136" font-family="Archivo, sans-serif" font-size="52" font-weight="900" fill="#0f172a">AKTIONS.CH</text>
  <rect x="556" y="96" width="500" height="72" rx="36" fill="#0f172a"/>
  <text x="806" y="134" font-family="Archivo, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">BLACK FRIDAY</text>
  <text x="806" y="134" font-family="Archivo, sans-serif" font-size="36" font-weight="800" fill="#f59e0b" text-anchor="middle" dx="150">IN 17 TAGEN</text>

  <!-- DEAL DES TAGES -->
  <text x="60" y="370" font-family="Archivo, sans-serif" font-size="118" font-weight="900" fill="#0f172a" letter-spacing="-2">DEAL</text>
  <text x="60" y="520" font-family="Archivo, sans-serif" font-size="118" font-weight="900" fill="#D52B1E" letter-spacing="-2">DES TAGES</text>

  <!-- Product card -->
  <rect x="60" y="610" width="960" height="820" rx="40" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>

  <!-- Product icon (yellow rounded square) -->
  <rect x="140" y="690" width="260" height="260" rx="60" fill="#f59e0b"/>
  <g transform="translate(235, 805)">
    <!-- simple watch icon -->
    <circle cx="130" cy="130" r="52" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <rect x="112" cy="95" width="36" height="14" rx="7" fill="#0f172a"/>
    <line x1="130" y1="130" x2="130" y2="78" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="130" y1="130" x2="198" y2="130" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Product name -->
  <text x="430" y="778" font-family="Archivo, sans-serif" font-size="64" font-weight="900" fill="#0f172a">Top Deal</text>
  <text x="430" y="866" font-family="Archivo, sans-serif" font-size="36" font-weight="600" fill="#475569">Schweiz · CHF · Black Friday 2026</text>

  <!-- Discount circle -->
  <circle cx="860" y="760" r="140" fill="#D52B1E"/>
  <text cx="860" cy="760" font-family="Archivo, sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" dy="0.35em">−41%</text>
  <text cx="860" cy="848" font-family="Archivo, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">RABATT</text>

  <!-- Pricing -->
  <text x="140" y="1130" font-family="Archivo, sans-serif" font-size="52" font-weight="700" fill="#64748b">CHF 279.–</text>
  <line x1="140" y1="1122" x2="320" y2="1122" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <rect x="380" y="1060" width="560" height="130" rx="34" fill="#f59e0b"/>
  <text x="660" y="1150" font-family="Archivo, sans-serif" font-size="96" font-weight="900" fill="#0f172a" text-anchor="middle">CHF 165</text>

  <!-- Green checkmark line -->
  <text x="140" y="1290" font-family="Archivo, sans-serif" font-size="34" font-weight="700" fill="#15803d">✓ Tiefster Preis seit 90 Tagen</text>

  <!-- CTA button -->
  <rect x="60" y="1430" width="960" height="110" rx="55" fill="url(#redgrad)"/>
  <text x="540" y="1512" font-family="Archivo, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">Link in Bio →</text>

  <!-- Fine print disclaimer -->
  <rect x="60" y="1610" width="960" height="250" fill="#f3f4f6"/>
  <text x="60" y="1660" font-family="Archivo, sans-serif" font-size="26" font-weight="900" fill="#0f172a">ANZEIGE</text>
  <text x="60" y="1710" font-family="Public Sans, sans-serif" font-size="28" fill="#475569" line-height="1.45">Affiliate-Link. Preise auf Amazon.de in EUR, Stand 10.11.2026; für die Lieferung in die Schweiz wird an der Kasse die Schweizer MWST berechnet. Preise können sich ändern.</text>
</svg>
